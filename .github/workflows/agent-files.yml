name: Agent files

on:
  pull_request:
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  check:
    name: Check generated agent files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
          install: false

      - name: Compare agent file hashes
        run: mise run check:agents
