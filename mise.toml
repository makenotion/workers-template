[tools]
node = "26.5.0"

[tasks."check:lint"]
run = "npx oxlint"

[tasks."check:format"]
run = "npx oxfmt --check"

[tasks.check]
depends = ["check:*"]

[tasks."check:agents"]
run = "./scripts/sync-agent-files.sh --check"

[tasks."fix:lint"]
run = "npx oxlint --fix"

[tasks."fix:format"]
run = "npx oxfmt --write"

[tasks."fix:agents"]
run = "./scripts/sync-agent-files.sh"

[tasks.fix]
depends = ["fix:*"]

[tasks.pre-commit]
depends = ["check"]
